name: Play Store Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Determine Track
        id: track
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" == *-alpha* ]]; then
            echo "TRACK=alpha" >> "$GITHUB_ENV"
          elif [[ "$REF_NAME" == *-beta* ]]; then
            echo "TRACK=beta" >> "$GITHUB_ENV"
          else
            echo "TRACK=production" >> "$GITHUB_ENV"
          fi

      - name: Decode Keystore
        env:
          KEYSTORE_B64: ${{ secrets.GEOTIFY_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > app/geotify-upload-key.keystore

      - name: Build Release Bundle
        run: ./gradlew bundleRelease
        env:
          GEOTIFY_KEYSTORE_PASSWORD: ${{ secrets.GEOTIFY_KEYSTORE_PASSWORD }}
          GEOTIFY_KEY_PASSWORD: ${{ secrets.GEOTIFY_KEY_PASSWORD }}

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAYSTORE_SERVICE_ACCOUNT_JSON }}
          packageName: dev.arrase.geotify
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ env.TRACK }}
          status: completed
